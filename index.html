<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icons/icon-192.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7e14ff" />
    <!-- viewport-fit=cover : sans lui, les env(safe-area-inset-*) valent 0 et
         le contenu ne peut jamais dire où sont l'encoche et la barre du bas
         d'un iPhone (chantier a40fccaa, "soigne-le pour iPhone"). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Safari ignore le manifest.webmanifest pour l'icône et le mode
         "sur l'écran d'accueil" : sans ces trois lignes, ajouter Jarvis à
         l'écran d'accueil d'un iPhone donnait une icône générique et
         ouvrait dans un onglet Safari au lieu du mode plein écran. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <title>Jarvis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
