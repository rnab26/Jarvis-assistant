name: Vérifications hors ligne

# Sur TOUTES les branches, volontairement : les deux autres workflows ne se
# déclenchent que sur le tronc, donc une session qui travaille sur sa branche
# n'a aucun retour avant d'avoir fusionné. Ces contrôles-ci ne demandent ni
# réseau, ni téléphone, ni secret — ils peuvent donc tourner partout, et
# c'est le seul filet qui existe avant la fusion.
on:
  push:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 et pas 20 : --experimental-strip-types (exécuter du TypeScript
          # sans étape de compilation) n'existe pas avant.
          node-version: 22
          cache: npm
      - run: npm ci

      # Le typecheck qui compte est celui des projets référencés — un
      # `tsc --noEmit` à la racine ne vérifie PAS l'app et dit « OK » à tort.
      - run: npx tsc -b

      - name: Les réglages sont déclarés et réglables
        run: node --experimental-strip-types scripts/verifier-reglages.ts

      - name: Ce que Jarvis fera sonner, et quand
        run: node --experimental-strip-types scripts/verifier-notifications.ts

      - name: La mise à jour rapide de l'app
        run: node --experimental-strip-types scripts/verifier-maj-web.ts

      - name: Les tours de parole
        run: node --experimental-strip-types scripts/verifier-dialogue.ts

      - name: Le réveil « Jarvis »
        run: node --experimental-strip-types scripts/verifier-mot-cle.ts

      - name: Les commandes comprises sans modèle
        run: node --experimental-strip-types scripts/verifier-commande-locale.ts

      - name: La clôture de la conversation à la voix
        run: node --experimental-strip-types scripts/verifier-fin-conversation.ts

      - name: L'envoi d'un chantier à Claude Code
        run: node --experimental-strip-types scripts/verifier-envoi-chantier.ts

      - name: L'étiquette d'échéance d'une tâche
        run: node --experimental-strip-types scripts/verifier-echeance.ts

      - name: Pas deux thèmes pour le même sujet
        run: node --experimental-strip-types scripts/verifier-theme.ts

      # Les seuils du dédoublonnage sont mesurés sur les vraies données : ce
      # contrôle refuse qu'on les resserre « pour être sûr » (plus rien ne
      # serait dédoublonné) ou qu'on les desserre « pour en attraper plus »
      # (deux dossiers distincts finiraient fondus en un).
      - name: La mémoire ne redit pas trois fois la même chose
        run: node --experimental-strip-types scripts/verifier-dedoublonnage.ts

      # Ce que Raphaël reprend à Jarvis doit lui revenir — et rien d'autre :
      # une erreur « serveur » n'apprend rien à un modèle de langue et coûte
      # du quota à chaque phrase.
      - name: Les corrections de Raphaël arrivent jusqu'au modèle
        run: node --experimental-strip-types scripts/verifier-corrections.ts

      # « Une panne qui se lit comme une absence » : un rappel de mémoire qui
      # échoue rendait le même résultat qu'un rappel qui n'a rien trouvé. Ce
      # contrôle lit le code, parce que la règle porte sur sa forme.
      - name: Une panne de la mémoire ne se lit pas comme une absence
        run: node --experimental-strip-types scripts/verifier-pannes-silencieuses.ts

      - name: Les sections du cockpit
        run: node --experimental-strip-types scripts/verifier-sections.ts

      # Les quatre nombres par section de « Où j'en suis ». Ce qui se joue là
      # est faux EN SILENCE : un chantier compté comme avançant alors que la
      # session qui l'avait pris s'est arrêtée, une question sans réponse qui
      # n'apparaît nulle part. On lit la réponse, et on la croit.
      - name: « Où j'en suis », en tête du cockpit
        run: node --experimental-strip-types scripts/verifier-ou-jen-suis.ts

      # Une question posée par une session doit REVENIR à Raphaël, et sa
      # réponse repartir vers les sessions sous une forme lisible des années
      # après. La fiche du 5 sept. n'enregistrait que les champs de texte, et
      # affichait « 0 / 14 » pendant qu'il répondait : personne ne l'a vu.
      - name: Ce qui attend sa décision, et ce qu'il répond
        run: node --experimental-strip-types scripts/verifier-decisions.ts

      - name: La section suggérée à la saisie
        run: node --experimental-strip-types scripts/verifier-suggestion-theme.ts

      - name: « Ça existe déjà » à la saisie d'un chantier
        run: node --experimental-strip-types scripts/verifier-doublon-chantier.ts

      - name: Ce qui a bougé depuis le dernier passage
        run: node --experimental-strip-types scripts/verifier-depuis-derniere-visite.ts

      - name: L'aller-retour avec une IA installée sur le téléphone
        run: node --experimental-strip-types scripts/verifier-aller-retour-ia.ts

      - name: Retrouver quelqu'un dans le répertoire du téléphone
        run: node --experimental-strip-types scripts/verifier-contact-repertoire.ts

      # Un `--` dans un commentaire XML casse le build Android entier, avec un
      # message qui ne parle jamais du commentaire. Le contrôle coûte une
      # seconde ici, contre un build Android complet pour le découvrir.
      - name: Les XML Android sont valides
        run: python3 -c "import xml.dom.minidom,glob;[xml.dom.minidom.parse(f) for f in glob.glob('android/app/src/main/res/**/*.xml',recursive=True)]"
