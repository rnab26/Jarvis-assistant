name: Vérifications hors ligne

# Sur TOUTES les branches, volontairement : les deux autres workflows ne se
# déclenchent que sur le tronc, donc une session qui travaille sur sa branche
# n'a aucun retour avant d'avoir fusionné. Ces contrôles-ci ne demandent ni
# réseau, ni téléphone, ni secret — ils peuvent donc tourner partout, et
# c'est le seul filet qui existe avant la fusion.
on:
  push:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 et pas 20 : --experimental-strip-types (exécuter du TypeScript
          # sans étape de compilation) n'existe pas avant.
          node-version: 22
          cache: npm
      - run: npm ci

      # Le typecheck qui compte est celui des projets référencés — un
      # `tsc --noEmit` à la racine ne vérifie PAS l'app et dit « OK » à tort.
      - run: npx tsc -b

      - name: Les réglages sont déclarés et réglables
        run: node --experimental-strip-types scripts/verifier-reglages.ts

      - name: Ce que Jarvis fera sonner, et quand
        run: node --experimental-strip-types scripts/verifier-notifications.ts

      - name: La mise à jour rapide de l'app
        run: node --experimental-strip-types scripts/verifier-maj-web.ts

      - name: Les tours de parole
        run: node --experimental-strip-types scripts/verifier-dialogue.ts

      - name: Le réveil « Jarvis »
        run: node --experimental-strip-types scripts/verifier-mot-cle.ts

      - name: Les commandes comprises sans modèle
        run: node --experimental-strip-types scripts/verifier-commande-locale.ts

      - name: La clôture de la conversation à la voix
        run: node --experimental-strip-types scripts/verifier-fin-conversation.ts

      # Le registre des erreurs n'avait qu'une ligne ouverte, et c'était une
      # fausse alerte : 363 rafales de veille dans une pièce calme signalées
      # comme des pannes. Ce contrôle garde la frontière dans les DEUX sens —
      # ne plus crier sur un silence, ne jamais se taire sur une vraie panne.
      - name: Ce qui finit dans le registre des erreurs, et ce qui n'y finit pas
        run: node --experimental-strip-types scripts/verifier-raison-ecoute.ts

      # Le cas qui compte : quand il NE répond PAS à « avec quelle
      # application ? », sa phrase suivante ne doit surtout pas être
      # enregistrée comme son application préférée — ce serait invisible et
      # définitif.
      - name: « Avec quelle application ? » en mode Live
        run: node --experimental-strip-types scripts/verifier-question-app-live.ts

      # Une action qui ne rend aucune phrase laissait le modèle Live combler
      # le silence — le 6 sept. il a comblé en annonçant que le message était
      # parti. L'aveu qui la remplace ne doit affirmer NI succès NI échec :
      # on ne sait pas, et c'est justement ce qu'il faut dire.
      - name: Une action muette ne devient ni un silence ni un mensonge
        run: node --experimental-strip-types scripts/verifier-retour-vide.ts

      # « La musique ne se coupe pas, mais il a du mal à entendre » — ses mots
      # du 6 sept. On baisse le son des autres apps pendant qu'il parle, et on
      # le remonte sur TOUTES les sorties. Surtout : PAS pendant la veille,
      # sinon une rafale toutes les 1 à 8 s ferait pomper sa musique sans arrêt.
      - name: La musique baisse pendant qu'il parle, et remonte à tous les coups
        run: node --experimental-strip-types scripts/verifier-baisser-son.ts

      - name: L'envoi d'un chantier à Claude Code
        run: node --experimental-strip-types scripts/verifier-envoi-chantier.ts

      - name: L'étiquette d'échéance d'une tâche
        run: node --experimental-strip-types scripts/verifier-echeance.ts

      - name: Pas deux thèmes pour le même sujet
        run: node --experimental-strip-types scripts/verifier-theme.ts

      # Les seuils du dédoublonnage sont mesurés sur les vraies données : ce
      # contrôle refuse qu'on les resserre « pour être sûr » (plus rien ne
      # serait dédoublonné) ou qu'on les desserre « pour en attraper plus »
      # (deux dossiers distincts finiraient fondus en un).
      - name: La mémoire ne redit pas trois fois la même chose
        run: node --experimental-strip-types scripts/verifier-dedoublonnage.ts

      # Ce que Raphaël reprend à Jarvis doit lui revenir — et rien d'autre :
      # une erreur « serveur » n'apprend rien à un modèle de langue et coûte
      # du quota à chaque phrase.
      - name: Les corrections de Raphaël arrivent jusqu'au modèle
        run: node --experimental-strip-types scripts/verifier-corrections.ts

      # « Une panne qui se lit comme une absence » : un rappel de mémoire qui
      # échoue rendait le même résultat qu'un rappel qui n'a rien trouvé. Ce
      # contrôle lit le code, parce que la règle porte sur sa forme.
      - name: Une panne de la mémoire ne se lit pas comme une absence
        run: node --experimental-strip-types scripts/verifier-pannes-silencieuses.ts

      # Jarvis constate ses propres échecs. La moitié de ces contrôles vérifie
      # le SILENCE : un détecteur trop large remplit le registre des erreurs
      # avec le fonctionnement normal du dialogue, et un registre bruyant n'est
      # plus lu du tout — pire que pas de détecteur.
      - name: Jarvis constate ses échecs, et se tait le reste du temps
        run: node --experimental-strip-types scripts/verifier-retours.ts

      # Ce réglage commande une SUPPRESSION sans corbeille, à chaque phrase.
      # Le contrôle lit LES DEUX moitiés — le bouton de Paramètres et la
      # fonction SQL — et refuse qu'elles divergent : une valeur que l'app
      # écrit et que le SQL ne comprend pas vaudrait « sans limite » en
      # silence, et le réglage ne servirait plus à rien.
      - name: La durée de conservation des conversations
        run: node --experimental-strip-types scripts/verifier-retention.ts

      - name: Les sections du cockpit
        run: node --experimental-strip-types scripts/verifier-sections.ts

      # Les quatre nombres par section de « Où j'en suis ». Ce qui se joue là
      # est faux EN SILENCE : un chantier compté comme avançant alors que la
      # session qui l'avait pris s'est arrêtée, une question sans réponse qui
      # n'apparaît nulle part. On lit la réponse, et on la croit.
      - name: « Où j'en suis », en tête du cockpit
        run: node --experimental-strip-types scripts/verifier-ou-jen-suis.ts

      # Une question posée par une session doit REVENIR à Raphaël, et sa
      # réponse repartir vers les sessions sous une forme lisible des années
      # après. La fiche du 5 sept. n'enregistrait que les champs de texte, et
      # affichait « 0 / 14 » pendant qu'il répondait : personne ne l'a vu.
      - name: Ce qui attend sa décision, et ce qu'il répond
        run: node --experimental-strip-types scripts/verifier-decisions.ts

      - name: La section suggérée à la saisie
        run: node --experimental-strip-types scripts/verifier-suggestion-theme.ts

      - name: « Ça existe déjà » à la saisie d'un chantier
        run: node --experimental-strip-types scripts/verifier-doublon-chantier.ts

      - name: Les doublons déjà en base
        run: node --experimental-strip-types scripts/verifier-doublons-existants.ts

      - name: Une tâche perso qui est en fait un chantier
        run: node --experimental-strip-types scripts/verifier-tache-ou-chantier.ts

      - name: Ce qui a bougé depuis le dernier passage
        run: node --experimental-strip-types scripts/verifier-depuis-derniere-visite.ts

      - name: L'aller-retour avec une IA installée sur le téléphone
        run: node --experimental-strip-types scripts/verifier-aller-retour-ia.ts

      # Un bouton « Autoriser » sur une autorisation qu'Android ne
      # redemandera plus jamais est un bouton mort, et rien à l'écran ne le
      # dit. Ce contrôle lit aussi le plugin Android : une ligne du catalogue
      # qu'il ne connaît pas afficherait « Pas encore » pour toujours.
      # « je lance » suivi de rien : le repli silencieux sur l'ouverture nue
      # de l'app faisait mentir Jarvis à chaque demande de musique.
      - name: Lancer une musique dit ce qui s'est vraiment passé
        run: node --experimental-strip-types scripts/verifier-musique.ts

      # Une demande redite à la voix ne doit pas créer un second chantier —
      # et une demande NEUVE ne doit jamais être refusée pour trois mots
      # communs : la perdre en silence serait bien pire que le doublon.
      - name: Dicter deux fois ne crée pas deux chantiers
        run: node --experimental-strip-types scripts/verifier-doublon-vocal.ts

      # Le garde-fou des commandes mal entendues ne doit jamais redevenir la
      # confirmation bloquante que Raphaël a écartée.
      - name: La fenêtre d'annulation des actions du téléphone
        run: node --experimental-strip-types scripts/verifier-fenetre-annulation.ts

      # La bulle : un interrupteur ne doit jamais dire « Activé » au-dessus
      # d'un écran vide, et un service de premier plan sans type refuse de
      # démarrer depuis Android 14, sans le moindre message.
      - name: La bulle flottante
        run: node --experimental-strip-types scripts/verifier-bulle.ts

      # Quand une déclaration du VoiceInteractionService manque, Android
      # rejette le service EN SILENCE : Jarvis disparaît de la liste des
      # assistants et rien, nulle part, ne dit pourquoi.
      # « Il me dit qu'il a envoyé un message alors que ce n'est pas vrai. »
      # Une chose qui ment ruine la confiance dans tout ce qui marche.
      - name: Jarvis n'annonce jamais au passé ce qu'il n'a pas fait
        run: node --experimental-strip-types scripts/verifier-honnetete.ts

      - name: Jarvis peut être choisi comme assistant du téléphone
        run: node --experimental-strip-types scripts/verifier-assistant.ts

      - name: Les autorisations du téléphone
        run: node --experimental-strip-types scripts/verifier-autorisations.ts

      - name: Retrouver quelqu'un dans le répertoire du téléphone
        run: node --experimental-strip-types scripts/verifier-contact-repertoire.ts

      # Une session qui se retire à tort ne coûte rien : Raphaël en ouvre une
      # lui-même. Une session qui démarre à tort dépense son crédit pendant
      # qu'il dort, ou code un chantier qu'il voulait d'abord trancher.
      - name: Une session autonome se retire quand il le faut
        run: node --experimental-strip-types scripts/verifier-sessions-autonomes.ts

      # Un `--` dans un commentaire XML casse le build Android entier, avec un
      # message qui ne parle jamais du commentaire. Le contrôle coûte une
      # seconde ici, contre un build Android complet pour le découvrir.
      - name: Les XML Android sont valides
        run: python3 -c "import xml.dom.minidom,glob;[xml.dom.minidom.parse(f) for f in glob.glob('android/app/src/main/res/**/*.xml',recursive=True)]"
