name: Build Android APK

on:
  push:
    branches: [claude/new-session-rn6puh]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "package.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_COMMIT_SHA: ${{ github.sha }}

      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publie aussi l'APK sur une "release" GitHub à URL fixe (tag
      # "latest-debug", toujours réécrite) : lien de téléchargement direct
      # et stable pour le menu Paramètres de l'app, sans avoir à naviguer
      # dans l'onglet Actions à chaque fois.
      - name: Publier l'APK en téléchargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Dernière build (debug)
          body: >
            APK debug généré automatiquement depuis le dernier commit de
            claude/new-session-rn6puh. Lien stable, toujours à jour.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
